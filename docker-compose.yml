services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dmp_db
      POSTGRES_USER: dmp_admin
      POSTGRES_PASSWORD: production_secret_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmp_admin -d dmp_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dmp_admin:production_secret_pass@db:5432/dmp_db
      SECRET_KEY: prod_super_secret_jwt_key_2026
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dmp_admin
      POSTGRES_PASSWORD: production_secret_pass
      POSTGRES_DB: dmp_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
